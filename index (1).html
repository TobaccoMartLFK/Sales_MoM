body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.45 'Schibsted Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif}
main{max-width:860px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:26px;font-weight:800;margin:0;letter-spacing:-.02em}
.sub{color:var(--mut);margin:4px 0 16px;font-size:13px}
.controls{margin-bottom:14px}
.controls label{display:block;font-size:12px;color:var(--mut);margin-bottom:4px}
.controls select{width:100%;font:600 14px inherit;font-family:inherit;padding:10px 12px;border:1.5px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px}
.controls select:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.tabs{display:flex;gap:6px;margin-bottom:18px;overflow-x:auto}
.tabs button{flex:1;min-width:max-content;font-weight:600;font-size:14px;font-family:inherit;padding:10px 14px;border:1.5px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;cursor:pointer}
.tabs button[aria-pressed=true]{background:var(--ac);border-color:var(--ac);color:#fff}
.tabs button:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border-block:1.5px solid var(--ink);margin-bottom:22px}
.kpi{padding:12px 10px 12px 0}.kpi+.kpi{padding-left:12px;border-left:1px solid var(--line)}
.kpi b{display:block;font-size:clamp(20px,5.5vw,32px);font-weight:800;letter-spacing:-.02em;color:var(--ac)}
.kpi span{font-size:12px;color:var(--mut)}
section{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
h2{font-size:16px;margin:0 0 12px;font-weight:600}
.share{display:flex;height:34px;border-radius:7px;overflow:hidden;margin-bottom:10px}
.share i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px}
.legend span:before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;background:var(--k)}
.row{display:grid;grid-template-columns:minmax(110px,38%) 1fr;gap:4px 10px;align-items:center;margin:7px 0;font-size:13px}
.row .bar{height:20px;background:var(--line);border-radius:4px;position:relative;overflow:hidden}
.row .bar i{position:absolute;inset:0 auto 0 0;background:var(--ac);border-radius:4px;transition:width .5s}
.row em{font-style:normal;font-weight:600;font-size:12px;position:absolute;right:6px;top:1px;color:var(--ink)}
.row .n{overflow-wrap:anywhere}
.note{font-size:12px;color:var(--mut);margin:12px 0 0}
.empty{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:28px 18px;text-align:center;color:var(--mut)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
footer{font-size:12px;color:var(--mut);margin-top:6px}
@media(prefers-reduced-motion:reduce){.row .bar i{transition:none}}

const MN=['January','February','March','April','May','June','July','August','September','October','November','December'];
const $=n=>'$'+n.toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:0});
const kpi=(b,s)=>`<div class="kpi"><b>${b}</b><span>${s}</span></div>`;
const bars=(rows,max)=>rows.map(r=>`<div class="row"><div class="n">${r[0]}</div><div class="bar"><i style="width:${Math.max(r[1]/max*100,1)}%"></i><em>${$(r[1])}</em></div></div>`).join('');
const empty=(a,b)=>`<div class="empty"><b>${a}</b>${b}</div>`;

function seg(s,t1,t2,note,total){return`<div class="kpis">${kpi($(s.sales),'Net sales')}${kpi((s.sales/total*100).toFixed(1)+'%','Share of store sales')}${kpi(s.units.toLocaleString(),'Units sold')}</div>`+
 (t1&&s.depts.length>1?`<section><h2>${t1}</h2>${bars(s.depts,s.depts[0][1])}</section>`:'')+
 `<section><h2>${t2}</h2>${bars(s.items.map(i=>[i[0]+' ('+i[2]+')',i[1]]),s.items[0][1])}<p class="note">Number in brackets is units sold. ${note}</p></section>`}

const views={
 total:{label:'Total sales',ac:'--c-total',html:d=>{
  const vn=new Set(d.vape.depts.map(r=>r[0])),cats=d.top.filter(r=>!vn.has(r[0]));
  if(d.vape.sales>0)cats.push(['Vapes',d.vape.sales]);
  const t5=cats.sort((a,b)=>b[1]-a[1]).slice(0,5),p=n=>(n/d.total*100).toFixed(1)+'%',sum=t5.reduce((a,r)=>a+r[1],0);
  return`
  <div class="kpis">${kpi($(d.total),'Net sales')}${kpi(d.units.toLocaleString(),'Units sold')}${kpi($(d.disc),'Discounts given')}</div>
  <section><h2>Top 5 categories</h2>
   <div class="share" style="background:var(--line)" role="img" aria-label="Top 5 categories, ${p(sum)} of sales">${t5.map((r,i)=>`<i style="width:${r[1]/d.total*100}%;background:var(--k${i+1})"></i>`).join('')}</div>
   <div class="legend">${t5.map((r,i)=>`<span style="--k:var(--k${i+1})">${r[0]} ${$(r[1])} (${p(r[1])})</span>`).join('')}</div>
   <p class="note">Together these five make up ${p(sum)} of net sales. All vape brands are counted as one category here. The All categories tab lists every department.</p></section>`}},
 vape:{label:'Vapes',ac:'--c-vape',html:d=>seg(d.vape,'Sales by brand','Best-selling vapes','Vapes = Disposable vapes, Juul Lab, Salt nic and Eonsmoke Labs departments.',d.total)},
 thc:{label:'THC-like',ac:'--c-thc',html:d=>seg(d.thc,'','Best-selling THC-like products','THC-like = everything in the CBD department. Mushroom and kratom are not counted.',d.total)},
 cat:{label:'All categories',ac:'--c-cat',html:d=>`<section><h2>Sales by category</h2>${bars(d.top,d.top[0][1])}<p class="note">The full category list goes here once the complete breakdown is added.</p></section>`}
};

const st={m:'ytd',tab:'total'};
const getData=()=>st.m==='ytd'?YTD:MONTHS[st.m]||null;
const monthSel=document.getElementById('month'),tabs=document.getElementById('tabs'),v=document.getElementById('v');
function fillMonths(){
 let o=`<option value="ytd">Year to date (Jan 1 to Oct 31)</option>`;
 for(let i=1;i<=11;i++){const k='2026-'+String(i).padStart(2,'0');o+=`<option value="${k}">${MN[i-1]} 2026${MONTHS[k]?'':' (no report yet)'}</option>`}
 monthSel.innerHTML=o;monthSel.value=st.m;
}
function render(){
 const vw=views[st.tab],d=getData(),mo=st.m==='ytd'?0:+st.m.split('-')[1];
 document.documentElement.style.setProperty('--ac','var('+vw.ac+')');
 document.getElementById('title').textContent=mo?'Store sales, '+MN[mo-1]+' 2026':'Store sales, Jan 1 to Oct 31, 2026';
 v.innerHTML=d?vw.html(d):empty('No report loaded for '+MN[mo-1]+' yet','Add that month’s Detailed Department Sales report to see it here.');
 [...tabs.children].forEach(b=>b.setAttribute('aria-pressed',b.dataset.k===st.tab));
}
Object.entries(views).forEach(([k,o])=>{const b=document.createElement('button');b.textContent=o.label;b.dataset.k=k;b.onclick=()=>{st.tab=k;render()};tabs.appendChild(b)});
monthSel.onchange=()=>{st.m=monthSel.value;render()};
fillMonths();render();
</script></body></html>
