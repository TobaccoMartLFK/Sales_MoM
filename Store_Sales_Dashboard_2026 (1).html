<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Store Sales Dashboard 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f6f8;--ink:#1b2233;--mut:#5d667a;--line:#dde1e9;--panel:#fff;--c-total:#2f3f8f;--c-vape:#0c8f84;--c-thc:#8a4bd1;--c-oth:#b9bfcc;--c-cig:#c2571a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#12151d;--ink:#e9ecf4;--mut:#9aa3b8;--line:#2a3042;--panel:#1a1f2b;--c-total:#8c9cff;--c-vape:#2fc9b9;--c-thc:#b98af2;--c-oth:#4a5166;--c-cig:#f0925a}}
:root[data-theme=dark]{--bg:#12151d;--ink:#e9ecf4;--mut:#9aa3b8;--line:#2a3042;--panel:#1a1f2b;--c-total:#8c9cff;--c-vape:#2fc9b9;--c-thc:#b98af2;--c-oth:#4a5166;--c-cig:#f0925a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.45 'Schibsted Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif}
main{max-width:860px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:26px;font-weight:800;margin:0;letter-spacing:-.02em}
.sub{color:var(--mut);margin:4px 0 18px;font-size:13px}
.tabs{display:flex;gap:6px;margin-bottom:18px;overflow-x:auto}
.tabs button{flex:1;min-width:max-content;font-weight:600;font-size:14px;font-family:inherit;padding:10px 14px;border:1.5px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;cursor:pointer}
#periods button{font-size:13px;padding:7px 12px}
#periods button[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.tabs button[aria-pressed=true]{background:var(--ac);border-color:var(--ac);color:#fff}
.tabs button:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border-block:1.5px solid var(--ink);margin-bottom:22px}
.kpi{padding:12px 10px 12px 0}.kpi+.kpi{padding-left:12px;border-left:1px solid var(--line)}
.kpi b{display:block;font-size:clamp(20px,5.5vw,32px);font-weight:800;letter-spacing:-.02em;color:var(--ac)}
.kpi span{font-size:12px;color:var(--mut)}
section{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
h2{font-size:16px;margin:0 0 12px;font-weight:600}
.share{display:flex;height:34px;border-radius:7px;overflow:hidden;margin-bottom:10px}
.share i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px}
.legend span:before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;background:var(--k)}
.row{display:grid;grid-template-columns:minmax(110px,38%) 1fr;gap:4px 10px;align-items:center;margin:7px 0;font-size:13px}
.row .bar{height:20px;background:var(--line);border-radius:4px;position:relative;overflow:hidden}
.row .bar i{position:absolute;inset:0 auto 0 0;background:var(--ac);border-radius:4px;transition:width .5s}
.row em{font-style:normal;font-weight:600;font-size:12px;position:absolute;right:6px;top:1px;color:var(--ink)}
.row .n{overflow-wrap:anywhere}
.note{font-size:12px;color:var(--mut);margin:12px 0 0}
footer{font-size:12px;color:var(--mut);margin-top:6px}
@media(prefers-reduced-motion:reduce){.row .bar i{transition:none}}
</style></head><body><main>
<h1 id="ttl"></h1>
<p class="sub">Source: Detailed Department Sales report from CRE. Net of discounts.</p>
<div class="tabs" id="periods" role="group" aria-label="Report period"></div>
<div class="tabs" id="tabs"></div>
<div id="v"></div>
<footer>Figures are totals for the selected report. The two reports overlap on Oct 1 to 6, so do not add them together.</footer>
</main>
<script>
const P={"ytd":{"total":67669.71,"units":9305,"disc":1314.24,"top":[["Disposable vapes",22895.24],["CBD / THC products",13470.35],["Grocery",11482.68],["Cigarettes",7289.74],["Tobacco",3444.38],["Accessories",3418.7],["Tobacco accessories",2376.5],["Open-ring items",1486.87],["Juul Lab",1139.5],["All other departments",1979.98]],"vape":{"sales":24405.59,"units":1197,"n":367,"depts":[["Disposable vapes",22895.24],["Juul Lab",1139.5],["Salt nic",235.88],["Eonsmoke Labs",134.97]],"items":[["Gb Pulse Miami Mint 15K",443.76,24],["Blinkers 2G Flip Hybrid Ga/Bn",419.88,12],["Blinkers 2G Flip Hybrid",384.89,11],["Lm Neramiami Mint Pod",343.85,15],["Vuse Alto 4 Pods Pack",323.91,9],["Blinkers 2G Flip Hybrid Wtr/Ch",314.91,9],["North 5K Blueberry Mint",291.85,15],["North 5K Mighty Mint",263.86,14],["Gb Pulse Frozen Strawberry 15K",263.86,14],["Foger 30K Sour Fcuking Fab",227.86,14]]},"thc":{"sales":13470.35,"units":1065,"n":92,"depts":[["CBD / THC products",13470.35]],"items":[["Zour Juicypeach 2Gm Each",791.01,99],["Zour Grp Bblgum 2Gm Each",751.06,94],["Zour Watermelon 2Gm Each",751.06,94],["Zourstash Hash2Gm Beryb Each",635.05,95],["Zaza 2 X 2G Thca Prerolls",584.55,45],["Zourstash Hash2Gm Citrus Each",545.24,76],["Xa Pops Sativa 1G",476.47,53],["Muhameds 3.5Gm Sativa Dispo",449.9,10],["Zourstash Hash2Gm Strap Each",443.43,57],["Xa Pops Indica 1G",287.68,32]]},"cig":{"sales":7289.74,"units":null,"n":null,"depts":[],"items":[]}},"oct":{"total":10901.2,"units":1534,"disc":204.71,"top":[["Disposable vapes",3693.49],["CBD / THC products",2186.03],["Cigarettes",2061.87],["Grocery",1454.22],["Tobacco",424.16],["Tobacco accessories",338.76],["Juul Lab",320.84],["Accessories",269.29],["All other departments",152.54]],"vape":{"sales":4054.31,"units":325,"n":165,"depts":[["Disposable vapes",3693.49],["Juul Lab",320.84],["Salt nic",39.98]],"items":[["Blinkers 2G Flip Indica",139.96,4],["Pixi 50K Vanilla Bean Coffee",119.92,8],["Vuse Alto 4 Pods Pack",71.98,2],["Blinkers 2G Flip Hybrid",69.98,2],["Gb Pulse Cool Mint",69.95,5],["Vuse Alto 2 Pods",59.97,3],["Gb Pulse Mexico Mango 15K",55.96,4],["Vuse Alto 1 Pod Pack",55.96,4],["Gb Clr 50K Miami Mint",53.97,3],["Foger 30K Frozen Banana Pod",51.96,4]]},"thc":{"sales":2186.03,"units":197,"n":34,"depts":[["CBD / THC products",2186.03]],"items":[["Icecream Rainbowsherbert 2.25G",305.49,51],["Zourstash Hash2Gm Beryb Each",239.6,40],["Icecream Pinaple Expres 2.25G",233.61,39],["Muhameds 3.5Gm Sativa Dispo",179.96,4],["Xa Pops Indica 1G",107.88,12],["Zaza 2 X 2G Thca Prerolls",103.92,8],["Xa Pops Indica Hybrid 1G",89.9,10],["Cookies Hybrid 5Gm Gelatti",79.98,2],["Nlla Wafferz 8000Mg Dabz Hybrd",69.99,1],["Geek Wtm Gelato Hybrid",59.99,1]]},"cig":{"sales":2061.87,"units":266,"n":26,"depts":[["Cigarettes",2061.87]],"items":[["Seneca Red 100S",287.76,66],["America Spirit Blue",232.56,17],["Camel Blue King",184.96,16],["Seneca Red Kings",152.6,35],["Seneca Menthol 100",130.8,30],["Marlborogold King Box",116.0,10],["America Spirit Dark Green",95.76,7],["Camel Crush Menthol Silver",92.48,8],["Newport Red 100",69.72,6],["Marlboro Red 100 Box",69.6,6]]}}};
const LBL={ytd:"Jan 1 to Oct 6",oct:"Oct 1 to Nov 1"};let cur="oct",D=P[cur];
const $=n=>'$'+n.toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:0});
const $$=n=>'$'+n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const R=()=>D.total-D.vape.sales-D.thc.sales-D.cig.sales;
const pct=n=>(n/D.total*100).toFixed(1)+'%';
const bars=(rows,max)=>rows.map(r=>`<div class="row"><div class="n">${r[0]}</div><div class="bar"><i style="width:${Math.max(r[1]/max*100,1)}%"></i><em>${$(r[1])}</em></div></div>`).join('');
const kpi=(b,s)=>`<div class="kpi"><b>${b}</b><span>${s}</span></div>`;
const views={
 total:{label:'Total sales',ac:'--c-total',html:()=>`
  <div class="kpis">${kpi($(D.total),'Net sales')}${kpi(D.units.toLocaleString(),'Units sold')}${kpi($(D.disc),'Discounts given')}</div>
  <section><h2>Where the money comes from</h2>
   <div class="share" role="img" aria-label="Vapes ${pct(D.vape.sales)}, THC-like ${pct(D.thc.sales)}, cigarettes ${pct(D.cig.sales)}, everything else ${pct(R())}">
    <i style="width:${D.vape.sales/D.total*100}%;background:var(--c-vape)"></i><i style="width:${D.thc.sales/D.total*100}%;background:var(--c-thc)"></i><i style="width:${D.cig.sales/D.total*100}%;background:var(--c-cig)"></i><i style="width:${R()/D.total*100}%;background:var(--c-oth)"></i></div>
   <div class="legend"><span style="--k:var(--c-vape)">Vapes ${$(D.vape.sales)} (${pct(D.vape.sales)})</span><span style="--k:var(--c-thc)">THC-like ${$(D.thc.sales)} (${pct(D.thc.sales)})</span><span style="--k:var(--c-cig)">Cigarettes ${$(D.cig.sales)} (${pct(D.cig.sales)})</span><span style="--k:var(--c-oth)">Everything else ${$(R())} (${pct(R())})</span></div></section>
  <section><h2>Sales by department</h2>${bars(D.top,D.top[0][1])}</section>`},
 vape:{label:'Vapes',ac:'--c-vape',html:()=>seg(D.vape,'Sales by brand','Best-selling vapes','Vapes = Disposable vapes, Juul Lab, Salt nic and Eonsmoke Labs departments.')},
 thc:{label:'THC-like',ac:'--c-thc',html:()=>seg(D.thc,'','Best-selling THC-like products','THC-like = everything in the CBD department (it holds the delta-8, THCA and similar items). Mushroom and kratom are not counted.')}

 ,cig:{label:'Cigarettes',ac:'--c-cig',html:()=>seg(D.cig,'','Best-selling cigarettes','Cigarettes = everything in the CIGARETTE department.')}
};
function seg(s,t1,t2,note){return `<div class="kpis">${kpi($(s.sales),'Net sales')}${kpi(pct(s.sales),'Share of store sales')}${kpi(s.units==null?'n/a':s.units.toLocaleString(),'Units sold')}</div>`+
 (t1&&s.depts.length>1?`<section><h2>${t1}</h2>${bars(s.depts,s.depts[0][1])}</section>`:'')+
 (!s.items.length?`<section><h2>${t2}</h2><p class="note">Item detail is not available for this period. Only the department total was kept from the earlier report.</p></section>`:`<section><h2>${t2}</h2>${bars(s.items.map(i=>[i[0]+' ('+i[2]+')',i[1]]),s.items[0][1])}<p class="note">Number in brackets is units sold. ${note}</p></section>`)}
const tabs=document.getElementById('tabs'),v=document.getElementById('v');
function show(k){D=P[cur];document.getElementById('ttl').textContent='Store sales, '+LBL[cur]+', 2026';
 [...document.getElementById('periods').children].forEach(b=>b.setAttribute('aria-pressed',b.dataset.p===cur));
 document.documentElement.style.setProperty('--ac','var('+views[k].ac+')');v.innerHTML=views[k].html();
 [...tabs.children].forEach(b=>b.setAttribute('aria-pressed',b.dataset.k===k))}
Object.entries(views).forEach(([k,o])=>{const b=document.createElement('button');b.textContent=o.label;b.dataset.k=k;b.onclick=()=>show(k);tabs.appendChild(b)});
const pe=document.getElementById('periods');Object.keys(LBL).reverse().forEach(p=>{const b=document.createElement('button');b.textContent=LBL[p];b.dataset.p=p;b.onclick=()=>{cur=p;show(document.querySelector('#tabs [aria-pressed=true]').dataset.k)};pe.appendChild(b)});
show('total');
</script></body></html>
